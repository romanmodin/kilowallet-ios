name: Screenshot checker regression

on:
  pull_request:
    paths:
      - 'scripts/check-screen.swift'
      - 'scripts/fixtures/**'
      - '.github/workflows/screenshot-check.yml'
  workflow_dispatch:
    inputs:
      roblo_preview:
        description: Exercise the pinned offline client on a disposable iPhone simulator
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual note text and reject incorrect text
        run: |
          set -euo pipefail
          set -x # Record exact fixture commands without recognized image contents.
          swiftc scripts/check-screen.swift -o /tmp/check-screen
          /tmp/check-screen scripts/fixtures/note-screen.png 'October test payout'
          /tmp/check-screen scripts/fixtures/note-screen.png 'Mining payout'
          set +e
          /tmp/check-screen scripts/fixtures/note-screen.png 'November test payout'
          result=$?
          set -e
          test "$result" -eq 1
          # Actual black simulator capture must never count as a rendered simple screen.
          set +e
          /tmp/check-screen scripts/fixtures/simple-blank.png 'advanced'
          result=$?
          set -e
          test "$result" -eq 1
          # Preserve the actual wrong/blank frames from run 41792640577.
          for fixture in restore-springboard tor-live-blank; do
            expected='Restore from words'
            [ "$fixture" = tor-live-blank ] && expected='Settings'
            set +e
            /tmp/check-screen "scripts/fixtures/$fixture.png" "$expected"
            result=$?
            set -e
            test "$result" -eq 1
          done

          # Actual wrong English frame and correct Spanish frame from run 41859580775.
          /tmp/check-screen scripts/fixtures/ln-running-es.png '460 550'
          set +e
          /tmp/check-screen scripts/fixtures/ln-running-welcome.png '460 550'
          result=$?
          set -e
          test "$result" -eq 1

          # Actual misleading iOS capture from native42014957376: the shared title
          # contains recovery words in its body too. Require the empty-form word count.
          /tmp/check-screen scripts/fixtures/restore-welcome.png 'Restore from words'
          set +e
          /tmp/check-screen scripts/fixtures/restore-welcome.png '0 words'
          result=$?
          set -e
          test "$result" -eq 1
          # Positive synthetic desktop render of the same shared Compose form.
          # This verifies OCR of the field; it is not iOS runtime qualification.
          /tmp/check-screen scripts/fixtures/restore-form-desktop.png '0 words'

          # Actual correctly rendered iOS form from failed native42069725060.
          # The word-count OCR was unreliable; the passphrase option is specific to Restore.
          /tmp/check-screen scripts/fixtures/restore-form-ios-556.png 'I also used a passphrase'
          set +e
          /tmp/check-screen scripts/fixtures/restore-welcome.png 'I also used a passphrase'
          result=$?
          set -e
          test "$result" -eq 1
      - name: Verify restore capture requirements
        run: python3 scripts/test-restore-capture.py

  # An opt-in simulator check, independent of full app qualification. No signing environment.
  roblo-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.roblo_preview
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify the pinned client artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/roblo-simulator/fetch-client.sh "$RUNNER_TEMP/kw-client"
      - name: Open the local client on a disposable iPhone simulator
        run: scripts/roblo-simulator/check-client.sh "$RUNNER_TEMP/kw-client/client.zip" "$RUNNER_TEMP/kw-preview"
      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblo-client-simulator
          path: ${{ runner.temp }}/kw-preview/
          if-no-files-found: warn
