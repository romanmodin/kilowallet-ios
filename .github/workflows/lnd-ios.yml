name: LND recovery candidate (unsigned iOS)

# Builds Lndmobile.xcframework (device arm64 + simulator arm64/x86_64) from lnd-engine/ENGINE.
# Diagnostic candidate only: tests and applies a pinned recovery patch.
# App artifact pins stay unchanged until separate native/rendering qualification.

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: kilowallet-lnd-recovery-candidate
  cancel-in-progress: false

jobs:
  bind:
    name: gomobile bind -target=ios,iossimulator
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Engine pins
        id: pin
        run: |
          for k in repo commit go gomobile tags iosversion; do
            echo "$k=$(grep "^$k=" lnd-engine/ENGINE | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pin.outputs.go }}
          cache: false
      - name: Build
        run: |
          set -o pipefail
          ./lnd-engine/build-ios.sh 2>&1 | tee lnd-candidate-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lndmobile-recovery-candidate
          path: |
            build/lnd/Lndmobile.xcframework.zip
            build/lnd/Lndmobile.xcframework.zip.sha256
            build/lnd/candidate-native-receipt.json
            build/lnd/candidate-tests.log
            build/lnd/resolved-modules.txt
            build/lnd/engine-module.diff
            build/lnd/btcwallet-source.diff
            lnd-candidate-build.log
          retention-days: 90
          compression-level: 0
