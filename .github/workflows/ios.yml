name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: iPhone release and simulator qualification
    runs-on: macos-15-intel
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select supported Xcode
        run: |
          set -euo pipefail
          selected=$(python3 -c 'import pathlib,re; p=list(pathlib.Path("/Applications").glob("Xcode_26*.app")); print(max(p,key=lambda x:tuple(map(int,re.findall(r"[0-9]+",x.name)))) if p else "")')
          test -n "$selected"
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 26

      - name: Test native runtime evidence checker
        run: |
          python3 scripts/test-runtime-check.py
          python3 scripts/test-ui-startup.py

      - name: Unit tests (JVM and iOS simulator)
        run: ./gradlew :core:jvmTest :core:iosX64Test :app:desktopTest :app:iosX64Test --stacktrace

      - name: Check native tests actually ran on the Intel simulator
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for module,minimum in [('core',108),('app',52)]:
              cases = [case for xml in Path(module+'/build/test-results/iosX64Test').glob('TEST-*.xml')
                       for case in ET.parse(xml).getroot().findall('testcase')]
              if len(cases) < minimum or any(len(c.findall('failure')+c.findall('error')+c.findall('skipped')) for c in cases):
                  raise SystemExit(f'{module}: expected at least {minimum} passing iOS tests, got {len(cases)} cases')
              print(f'{module}: {len(cases)} passing iOS tests')
          PYTEST

      - name: Preserve JVM regression evidence before optional live scan
        if: always()
        run: |
          mkdir -p build/unit-test-results
          if [ -d core/build/test-results/jvmTest ]; then cp -R core/build/test-results/jvmTest build/unit-test-results/core-jvm; fi

      - name: Live scan using independently approved server certificate
        if: ${{ vars.KW_LIVE_CERT_SHA256 != '' }}
        env:
          KW_LIVE: "1"
          KW_LIVE_PIN: ${{ vars.KW_LIVE_CERT_SHA256 }}
        run: ./gradlew :core:jvmTest --tests '*LiveServerTest*' --rerun-tasks --stacktrace

      - name: Fetch the Lightning engine (Lndmobile.xcframework, checked against lnd-engine/ENGINE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-lnd-engine.sh

      - name: Fetch the Ark engine (KilombinoArk.xcframework, checked against ark-engine/ENGINE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-ark-engine.sh

      - name: Fetch the Tor engine (KilombinoTor.xcframework, checked against tor-engine/ENGINE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-tor-engine.sh

      - name: Build the app for the iOS Simulator (no signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
            > build/xcodebuild.log 2>&1
          test -x build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app/Kilowallet

      - name: Boot a simulator, launch the app and take screenshots
        run: ./scripts/ci-screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app screenshots

      - name: Verify live native engine outcomes
        run: python3 scripts/check-runtime.py screenshots-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            build/unit-test-results/
            build/xcodebuild.log
            screenshots-logs/

      - name: Build Release for iphoneos without signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            > build/xcodebuild-release.log 2>&1
          test -x build/dd/Build/Products/Release-iphoneos/Kilowallet.app/Kilowallet
          xcrun lipo build/dd/Build/Products/Release-iphoneos/Kilowallet.app/Kilowallet -verify_arch arm64
          du -sh build/dd/Build/Products/Release-iphoneos/Kilowallet.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-log
          path: build/xcodebuild-release.log
