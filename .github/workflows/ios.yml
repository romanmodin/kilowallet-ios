name: Rendering candidate LND frame diagnostic
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: kilowallet-rendering-candidate-frame-diagnostic
  cancel-in-progress: false
jobs:
  frame:
    name: Exact-source synthetic LND frame recapture
    runs-on: macos-15
    timeout-minutes: 110
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 68148c8c5741c7b84b37f33322e67273f7208a19
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: candidate-frame-harness
        sparse-checkout: .github/diagnostics
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@v4
    - name: Select supported Xcode and verify unchanged source
      run: 'test "$(uname -m)" = arm64

        set -euo pipefail

        test "$(git rev-parse HEAD)" = 68148c8c5741c7b84b37f33322e67273f7208a19

        test "$(git rev-parse HEAD^{tree})" = 9feb8f8d99f115c6bb9d10cd2c08358cc5543484

        selected=$(python3 -c ''import pathlib,re; p=list(pathlib.Path("/Applications").glob("Xcode_26*.app"));
        print(max(p,key=lambda x:tuple(map(int,re.findall(r"[0-9]+",x.name)))))'')

        sudo xcode-select --switch "$selected/Contents/Developer"

        xcodebuild -version

        '
    - name: Fetch all pinned native engines
      env:
        GH_TOKEN: ${{ github.token }}
      run: './scripts/fetch-lnd-engine.sh

        ./scripts/fetch-ark-engine.sh

        ./scripts/fetch-tor-engine.sh

        '
    - name: Verify pinned arm64 simulator slices
      run: "python3 - <<'CHECK'\nimport plistlib\nfrom pathlib import Path\nfor name in ['Lndmobile','KilombinoArk','KilombinoTor']:\n\
        \    root=Path('iosApp/Frameworks')/(name+'.xcframework')\n    data=plistlib.loads((root/'Info.plist').read_bytes())\n\
        \    matches=[x for x in data['AvailableLibraries'] if x.get('SupportedPlatform')=='ios' and x.get('SupportedPlatformVariant')=='simulator'\
        \ and 'arm64' in x['SupportedArchitectures']]\n    assert len(matches)==1, (name,matches)\n    print(name,matches[0]['LibraryIdentifier'])\n\
        CHECK\n"
    - name: Build unchanged simulator app
      run: 'set -euo pipefail

        mkdir -p build

        xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination
        ''generic/platform=iOS Simulator'' -derivedDataPath build/dd ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
        build > build/xcodebuild.log 2>&1

        test -x build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app/Kilowallet

        '
    - name: Capture create screen and synthetic LND foreground re-entry
      run: 'set -euo pipefail

        python3 -B candidate-frame-harness/.github/diagnostics/test-capture-lnd-frame.py -v

        python3 -B candidate-frame-harness/.github/diagnostics/test-monitor-capture.py -v

        python3 -u candidate-frame-harness/.github/diagnostics/monitor-capture.py screenshots-logs/host-resources.jsonl
        -- python3 -u candidate-frame-harness/.github/diagnostics/capture-lnd-frame.py build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: candidate-lnd-frame-evidence
        path: 'screenshots/

          screenshots-logs/

          build/xcodebuild.log

          '
        if-no-files-found: error
        retention-days: 14
