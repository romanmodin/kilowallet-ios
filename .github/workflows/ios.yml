name: Uninstrumented History repeated startup
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: kilowallet-history-startup-diagnostic
  cancel-in-progress: false
jobs:
  frame:
    name: Welcome to History synthetic startup
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@v4
      with:
        ref: c4f487efc9b328263f15d91c51670d919a9b31b9
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: candidate-frame-harness
        sparse-checkout: .github/diagnostics
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@v4
    - name: Select supported Xcode and verify unchanged source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = c4f487efc9b328263f15d91c51670d919a9b31b9

        test "$(git rev-parse HEAD^{tree})" = aee44f508589fa69b41899821de34a7d26c01607

        selected=$(python3 -c ''import pathlib,re; p=list(pathlib.Path("/Applications").glob("Xcode_26*.app"));
        print(max(p,key=lambda x:tuple(map(int,re.findall(r"[0-9]+",x.name)))))'')

        sudo xcode-select --switch "$selected/Contents/Developer"

        xcodebuild -version

        '
    - name: Fetch all pinned native engines
      env:
        GH_TOKEN: ${{ github.token }}
      run: './scripts/fetch-lnd-engine.sh

        ./scripts/fetch-ark-engine.sh

        ./scripts/fetch-tor-engine.sh

        '
    - name: Build exact unchanged simulator app
      run: 'set -euo pipefail

        mkdir -p build

        xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration
        Debug -sdk iphonesimulator -destination ''generic/platform=iOS Simulator''
        -derivedDataPath build/dd ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
        build > build/xcodebuild.log 2>&1

        test -x build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app/Kilowallet

        '
    - name: Require three consecutive unchanged History launches
      run: python3 -u candidate-frame-harness/.github/diagnostics/repeat-history-unchanged.py
        build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unchanged-history-repeat-evidence
        path: 'build/history-repeats/

          build/xcodebuild.log

          '
        if-no-files-found: error
        retention-days: 14
