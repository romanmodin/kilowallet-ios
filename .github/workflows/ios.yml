name: iOS RC7 focused RPC visual capture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Diagnostic only - RC7 RPC visual coverage
    runs-on: macos-15-intel
    # Focused simulator diagnostic only; never use as full native qualification.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select supported Xcode
        run: |
          set -euo pipefail
          selected=$(python3 -c 'import pathlib,re; p=list(pathlib.Path("/Applications").glob("Xcode_26*.app")); print(max(p,key=lambda x:tuple(map(int,re.findall(r"[0-9]+",x.name)))) if p else "")')
          test -n "$selected"
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 26

      - name: Test native runtime evidence checker
        run: |
          python3 scripts/test-runtime-check.py
          python3 scripts/test-ui-startup.py
          python3 scripts/test-rpc-capture.py

      - name: App regression tests on the iOS simulator
        run: ./gradlew :app:iosX64Test --stacktrace

      - name: Fetch the Lightning engine (Lndmobile.xcframework, checked against lnd-engine/ENGINE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-lnd-engine.sh

      - name: Fetch the Ark engine (KilombinoArk.xcframework, checked against ark-engine/ENGINE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-ark-engine.sh

      - name: Fetch the Tor engine (KilombinoTor.xcframework, checked against tor-engine/ENGINE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-tor-engine.sh

      - name: Build the app for the iOS Simulator (no signing)
        id: simulator_build
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
            > build/xcodebuild.log 2>&1
          test -x build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app/Kilowallet

      - name: Capture synthetic RPC settings certificate and rejected address
        run: |
          status=0
          for screen in rpc-settings rpc-cert rpc-error; do
            ./scripts/ci-screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app screenshots "$screen" || status=1
          done
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            build/unit-test-results/
            build/xcodebuild.log
            screenshots-logs/
